<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori Produk</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F4F7FC;
      margin: 0;
      padding: 20px;
      color: #0A1D56;
    }
    .kategori {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-top: 50px;
    }
    .kategori div {
      text-align: center;
      cursor: pointer;
      margin: 20px;
    }
    .kategori img {
      width: 50px;
      height: 50px;
    }
    /* Popup Modal */
    #popupDetail {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -20%);
      width: 60%;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }
    #popupDetail span {
      float: right;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
      color: #C70039;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Kategori Produk</h2>

  <div class="kategori">
    <div onclick="tampilkanDetail('mouse')">
      <img src="mouse-icon.png" alt="Mouse" /><br />Mouse
    </div>
    <div onclick="tampilkanDetail('notebook')">
      <img src="notebook-icon.png" alt="Notebook" /><br />Notebook
    </div>
    <div onclick="tampilkanDetail('smartband')">
      <img src="smartband-icon.png" alt="Smart Band" /><br />Smart Band
    </div>
    <div onclick="tampilkanDetail('smartphone')">
      <img src="smartphone-icon.png" alt="Smartphone" /><br />Smartphone
    </div>
    <div onclick="tampilkanDetail('speaker')">
      <img src="speaker-icon.png" alt="Speaker" /><br />Speaker
    </div>
  </div>

  <!-- Popup Modal -->
  <div id="popupDetail">
    <span onclick="tutupDetail()">&times;</span>
    <div id="isiDetail"></div>
  </div>

  <script>
    function tampilkanDetail(kategori) {
      let isi = "";

      switch (kategori) {
        case 'mouse':
          isi = `<h3>Mouse</h3><p>Mouse wireless, Bluetooth dan gaming. Harga mulai Rp 100.000.</p>`;
          break;
        case 'notebook':
          isi = `<h3>Notebook</h3><p>Laptop berbagai merek: Asus, Acer, HP. Mulai Rp 3.500.000.</p>`;
          break;
        case 'smartband':
          isi = `<h3>Smart Band</h3><p>Smart Band Xiaomi, Huawei, dan lainnya. Mulai Rp 250.000.</p>`;
          break;
        case 'smartphone':
          isi = `<h3>Smartphone</h3><p>Samsung, Xiaomi, iPhone dan banyak lagi. Harga mulai Rp 2.000.000.</p>`;
          break;
        case 'speaker':
          isi = `<h3>Speaker</h3><p>Speaker Bluetooth JBL, Sony, Polytron. Mulai Rp 300.000.</p>`;
          break;
      }

      document.getElementById("isiDetail").innerHTML = isi;
      document.getElementById("popupDetail").style.display = "block";
    }

    function tutupDetail() {
      document.getElementById("popupDetail").style.display = "none";
    }
  </script>
</body>
</html>
